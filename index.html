  // --- бот за красного ---
  const BOT_LEVELS = {
    // aimErr — разброс прицела в градусах, react — сколько мс думает, увидев соперника
    easy:   { aimErr: 14, react: 700, dodge: 0,    pierce: false, flip: false, label: 'лёгкий' },
    medium: { aimErr: 5,  react: 330, dodge: 0.45, pierce: true,  flip: true,  label: 'средний' },
    hard:   { aimErr: 1,  react: 130, dodge: 0.95, pierce: true,  flip: true,  label: 'злой' }
  };
  const bot = {};
  function resetBot() {
    Object.assign(bot, { holdUntil: 0, seeSince: 0, blindSince: 0, aimOffset: 0, prevDiff: null, aimMode: '',
      waypoint: null, nextPath: 0, lastDist: Infinity,
      stillSince: 0, lastX: 0, lastY: 0, nextFlip: 0 });
  }
  resetBot();
  const angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90;
  const angDiff = (target, cur) => ((target - cur + 540) % 360) - 180;
  function rayClear(a, b, walls, pad = 3, withTurns = true) {
    const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.ceil(d / 5);
    for (let i = 1; i < n; i++) {
      const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
      if (walls.some(w => rectHit(w, x, y, pad))) return false;
      if (withTurns && turnstiles.length && turnHit(x, y, pad)) return false;
    }
    return true;
  }
  // Путь по клеткам сетки в обход стен (поиск в ширину)
  function nextWaypoint(from, to) {
    const g = makeGrid(fieldRect.width, fieldRect.height);
    const blocked = new Set();
    getWallsPx().forEach(w => {
      const [c0, r0] = g.cellOf(w.x + 1, w.y + 1), [c1, r1] = g.cellOf(w.x + w.w - 1, w.y + w.h - 1);
      for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) blocked.add(key(c, r));
    });
    // клетки, через которые сейчас проходят лопасти турникетов
    if (turnstiles.length)
      for (let r = 0; r < g.rows; r++)
        for (let c = 0; c < g.cols; c++)
          if (turnHit(g.ox + c * BLOCK + BLOCK / 2, g.oy + r * BLOCK + BLOCK / 2, 10)) blocked.add(key(c, r));
    const start = g.cellOf(from.x, from.y), goal = key(...g.cellOf(to.x, to.y));
    const prev = new Map([[key(...start), null]]);
    const q = [start];
    while (q.length) {
      const [c, r] = q.shift();
      if (key(c, r) === goal) break;
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc = c + dc, nr = r + dr, k = key(nc, nr);
        if (nc < 0 || nr < 0 || nc >= g.cols || nr >= g.rows || blocked.has(k) || prev.has(k)) continue;
        prev.set(k, [c, r]); q.push([nc, nr]);
      }
    }
    if (!prev.has(goal)) return null;
    const path = [];
    for (let k = goal; k; ) { const [c, r] = k.split(',').map(Number); path.unshift([c, r]); const pv = prev.get(k); k = pv ? key(...pv) : null; }
    // самая дальняя точка пути (до 6 клеток), куда можно проехать по прямой, не задев стену
    const centre = ([c, r]) => ({ x: g.ox + c * BLOCK + BLOCK / 2, y: g.oy + r * BLOCK + BLOCK / 2 });
    const walls = getWallsPx();
    for (let k = Math.min(6, path.length - 1); k >= 1; k--) {
      const pt = centre(path[k]);
      if (rayClear(from, pt, walls, TANK_PAD + 1)) return pt;
    }
    return centre(path[Math.min(1, path.length - 1)]);
  }
  // Рикошеты: прогоняем полёт снаряда с отскоками наперёд.
  // true — снаряд вернётся в самого бота (пока тот едет moveDist пикселей вперёд)
  function shotHitsSelf(b, enemy, moveDist) {
    const left0 = ricochetCount();
    if (!left0 || !settings.selfDamage) return false;
    const rad = (b.angle - 90) * Math.PI / 180, dx0 = Math.cos(rad), dy0 = Math.sin(rad);
    const walls = getWallsPx(), FW = fieldRect.width, FH = fieldRect.height;
    let x = b.x + dx0 * 9, y = b.y + dy0 * 9, dx = dx0, dy = dy0, left = left0, bounced = false;
    const dt = 1 / 120;
    for (let t = 0; t < 1.8; t += dt) {
      const px = x, py = y;
      x += dx * SHELL_SPEED * dt; y += dy * SHELL_SPEED * dt;
      if (x < 4 || x > FW - 4) { if (!left) return false; dx = -dx; x = Math.max(4, Math.min(FW - 4, x)); left--; bounced = true; }
      if (y < 4 || y > FH - 4) { if (!left) return false; dy = -dy; y = Math.max(4, Math.min(FH - 4, y)); left--; bounced = true; }
      const w = walls.find(r => rectHit(r, x, y, 0));
      if (w) {
        if (!left) return false;
        const sx = !(px > w.x && px < w.x + w.w), sy = !(py > w.y && py < w.y + w.h);
        if (sx || !sy) dx = -dx;
        if (sy || !sx) dy = -dy;
        x = px; y = py; left--; bounced = true;
      }
      if (Math.hypot(x - enemy.x, y - enemy.y) < HIT_RADIUS) return false;
      const go = Math.min(t * MOVE_SPEED, moveDist);
      if (bounced && Math.hypot(x - (b.x + dx0 * go), y - (b.y + dy0 * go)) < HIT_RADIUS + 4) return true;
    }
    return false;
  }

  function updateBot(now) {
    const P = BOT_LEVELS[settings.opponent];
    if (!P || gameOver) return;
    const b = p2, t = p1, walls = getWallsPx();

    if (b.pressed) {
      // едем: отпускаем, когда доехали, проехали мимо точки или упёрлись
      const moved = Math.hypot(b.x - bot.lastX, b.y - bot.lastY);
      bot.lastX = b.x; bot.lastY = b.y;
      if (moved > 0.3) bot.stillSince = now; else if (!bot.stillSince) bot.stillSince = now;
      let done = now >= bot.holdUntil || now - bot.stillSince > 180;
      if (bot.waypoint) {
        const d = Math.hypot(bot.waypoint.x - b.x, bot.waypoint.y - b.y);
        if (d < 6 || d > bot.lastDist + 0.5) done = true;
        bot.lastDist = d;
      }
      if (done) { b.release(); bot.waypoint = null; bot.prevDiff = null; }
      return;
    }

    // уворот от летящего снаряда
    if (P.dodge) {
      // летящие во врага снаряды и свои, уже отскочившие от стен
      const danger = t.shells.concat(settings.selfDamage ? b.shells.filter(s => s.bounces > 0) : []);
      for (const s of danger) {
        if (s.botSeen) continue;
        const rx = b.x - s.x, ry = b.y - s.y, dist = Math.hypot(rx, ry);
        if (dist > 120) continue;
        const along = rx * s.dx + ry * s.dy;
        const miss = Math.abs(rx * s.dy - ry * s.dx);
        s.botSeen = true;
        if (along > 0 && miss < 16 && Math.random() < P.dodge && !b.shieldActive && !shotHitsSelf(b, t, 20)) {
          if ((bot.lastAct = 'dodge') && b.press()) { bot.holdUntil = now + 220; bot.waypoint = null; bot.stillSince = now; }
          return;
        }
      }
    }


    const see = rayClear(b, t, walls);
    const seeThroughWood = !see && P.pierce && b.pierceReady() && rayClear(b, t, staticWalls, 3, false);
    const shoot = see || seeThroughWood;
    let target, tol;
    if (shoot) {
      bot.blindSince = 0;
      if (!bot.seeSince) { bot.seeSince = now; bot.aimOffset = (Math.random() * 2 - 1) * P.aimErr; }
      const dist = Math.hypot(t.x - b.x, t.y - b.y);
      target = angleTo(b, t) + bot.aimOffset;
      // чем дальше цель, тем точнее надо навести
      tol = Math.max(1.8, Math.atan(7 / dist) * 180 / Math.PI);
    } else {
      bot.seeSince = 0;
      if (!bot.blindSince) bot.blindSince = now;
      // «Последний выстрел»: каждое движение — выстрел. Едем, только если соперника
      // не видно дольше 4 с, и последний патрон всегда бережём для цели
      if (modes.lastShot && b.ammo > 0 && (b.ammo === 1 || now - bot.blindSince < 4000)) return;
      if (now > bot.nextPath || !bot.waypoint) { bot.waypoint = nextWaypoint(b, t); bot.nextPath = now + 400; }
      if (!bot.waypoint) return;
      target = angleTo(b, bot.waypoint); tol = 8;
    }
    const mode = shoot ? 'shoot' : 'nav';
    if (mode !== bot.aimMode) { bot.aimMode = mode; bot.prevDiff = null; }
    const diff = angDiff(target, b.angle);
    // прицел за кадр поворачивает на ~3,5°, поэтому ловим момент, когда он проходит через цель
    const crossed = bot.prevDiff !== null && Math.sign(diff) !== Math.sign(bot.prevDiff)
      && Math.abs(diff) < 20 && Math.abs(bot.prevDiff) < 20;
    bot.prevDiff = diff;
    if (Math.abs(diff) <= tol || crossed) {
      if (shoot) {
        if (now - bot.seeSince < P.react) return;
        if (t.shieldActive) return; // в щит не стреляем — ждём, держа на прицеле
        bot.aimOffset = (Math.random() * 2 - 1) * P.aimErr;
        if (seeThroughWood) { b.usePierce(); return; }
        if (shotHitsSelf(b, t, 20)) return;
        if ((bot.lastAct = 'shoot') && b.press()) { bot.holdUntil = now + 60 + Math.random() * 140; bot.waypoint = null; bot.stillSince = now; }
        return;
      }
      if (shotHitsSelf(b, t, Math.hypot(bot.waypoint.x - b.x, bot.waypoint.y - b.y))) return;
      if ((bot.lastAct = 'nav') && b.press()) {
        bot.holdUntil = now + 1500; bot.stillSince = now; bot.lastX = b.x; bot.lastY = b.y;
        bot.lastDist = Math.hypot(bot.waypoint.x - b.x, bot.waypoint.y - b.y);
      }
      return;
    }
    // крутимся не в ту сторону и цель далеко — быстрый тап меняет направление
    if (P.flip && now > bot.nextFlip && Math.abs(diff) > 70 && Math.sign(diff) !== Math.sign(b.rotateDir)
        && !(modes.lastShot && b.ammo > 0)
        && !shotHitsSelf(b, t, 4)) {
      if ((bot.lastAct = 'flip') && b.press()) { bot.holdUntil = now + 30; bot.waypoint = null; bot.stillSince = now; bot.nextFlip = now + 900; }
    }
  }

  document.getElementById('menuBtn').addEventListener('click', showLevels);
  showHome();

  let last = performance.now();
  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;

    if (!gameOver && playing && menu.hidden) {
      updateLevel(now, [p1, p2]);
      updateTurnstiles(now, [p1, p2]);
      updatePortals(dt, [p1, p2]);
      updateBot(now);
      updatePlayer(p1, dt, now);
      updatePlayer(p2, dt, now);
      checkHits(p1);
      if (!gameOver) checkHits(p2);
      checkDraw();
    }

    tank1El.style.transform = `translate(${p1.x - 9.5}px, ${p1.y - 8.5}px) rotate(${p1.angle}deg) scale(${TANK_SCALE})`;
    tank2El.style.transform = `translate(${p2.x - 9.5}px, ${p2.y - 8.5}px) rotate(${p2.angle}deg) scale(${TANK_SCALE})`;

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}</script>
